<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b32"><title>قارئ المكتبة | محمود يسري العزب</title><style>
:root{--bg:#0b1425;--panel:#172947;--gold:#e2c36b;--text:#f7f3e9;--muted:#cbd3e1;--line:rgba(226,195,107,.3)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7}.bar{position:sticky;top:0;z-index:3;background:#101b32;border-bottom:1px solid var(--line);padding:12px}.bar-inner{max-width:1050px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.bar a{color:var(--gold);text-decoration:none}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools button,.tools a{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;text-decoration:none}.meta{text-align:center;padding:18px 10px}.meta h1{font-size:clamp(22px,4vw,32px);margin:0;color:var(--gold)}.meta p{margin:3px;color:var(--muted)}.viewer{max-width:1000px;margin:0 auto 28px;padding:0 12px}.page-wrap{background:#202a3a;border-radius:12px;min-height:50vh;display:flex;justify-content:center;align-items:flex-start;padding:12px;overflow:auto}.page-wrap canvas{max-width:100%;height:auto;box-shadow:0 5px 22px #0008;background:white}.status{text-align:center;color:var(--muted);padding:12px}.bottom{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:12px}.bottom button{background:var(--gold);border:0;border-radius:20px;padding:9px 17px;font-weight:bold;cursor:pointer}.bottom button:disabled{opacity:.35;cursor:not-allowed}.night{--bg:#05080d;--panel:#0e1725;--text:#e8e8e8}.night .page-wrap{background:#090d14}.notice{text-align:center;color:var(--muted);font-size:13px;padding:0 15px 24px}body.light{--bg:#f1eee6;--panel:#fff;--text:#1c2636;--muted:#465366;--line:#c7b77e}body.light .bar{background:#fff}body.light .tools button,body.light .tools a{color:#1c2636}body.light .page-wrap{background:#d7dbe1}@media(max-width:600px){.bar-inner{justify-content:center}.tools{justify-content:center}}
</style></head><body><header class="bar"><div class="bar-inner"><a href="index.html">← العودة إلى المكتبة</a><div class="tools"><button id="smaller">تصغير −</button><button id="bigger">تكبير +</button><button id="theme">الوضع الليلي/النهاري</button><a id="download" download>تحميل PDF</a></div></div></header><div class="meta"><h1 id="title">قارئ المكتبة</h1><p id="subtitle">محمود يسري العزب</p></div><main class="viewer"><div class="page-wrap"><canvas id="page"></canvas></div><div class="status" id="status">جارٍ تحميل الكتاب…</div><div class="bottom"><button id="prev">الصفحة السابقة</button><span id="counter">— / —</span><button id="next">الصفحة التالية</button></div></main><p class="notice">يحفظ القارئ آخر صفحة وصلت إليها على هذا الجهاز. فهرس الفصول التفصيلي سيُضاف بعد تجهيز بيانات فصول كل كتاب.</p><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
const books={
 jrah:{title:'من جراح النكسة إلى أنياب العبور',subtitle:'الجيش الذي أعاد كتابة التاريخ... بالنار.',file:'books/jrah.pdf'},
 kharaji:{title:'خارج حدود الحكاية',subtitle:'رحلة في أعماق الإنسان وأسرار الحياة والوجود.',file:'books/kharaji.pdf'},
 sinai:{title:'سيناء 67: يوم سقطت الرحمة',subtitle:'الملف المنسي لجنود مصر في النكسة.',file:'books/sinai.pdf'},
 heyn:{title:'حين دقت القلوب على أبواب مصر',subtitle:'شخصيات من خارجها تركت أثرًا في تاريخها.',file:'books/heyn.pdf'}
};const id=new URLSearchParams(location.search).get('book')||'kharaji',book=books[id]||books.kharaji;document.title=book.title+' | قارئ المكتبة';document.getElementById('title').textContent=book.title;document.getElementById('subtitle').textContent=book.subtitle;document.getElementById('download').href=book.file;
if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}let pdf=null,page=1,scale=1.15,renderTask=null;const canvas=document.getElementById('page'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next'),key='mahmoud-library-page-'+id;
async function draw(){if(!pdf)return;if(renderTask){try{renderTask.cancel()}catch(e){}}const p=await pdf.getPage(page);const vp=p.getViewport({scale});canvas.width=vp.width;canvas.height=vp.height;renderTask=p.render({canvasContext:ctx,viewport:vp});try{await renderTask.promise}catch(e){}counter.textContent=page+' / '+pdf.numPages;status.textContent='صفحة '+page+' من '+pdf.numPages;prev.disabled=page<=1;next.disabled=page>=pdf.numPages;localStorage.setItem(key,String(page));}
(async()=>{try{if(!window.pdfjsLib)throw Error('تعذر تحميل محرك القراءة. تأكد من الاتصال بالإنترنت ثم أعد المحاولة.');pdf=await pdfjsLib.getDocument(book.file).promise;const saved=parseInt(localStorage.getItem(key)||'1',10);page=Math.min(Math.max(saved,1),pdf.numPages);await draw()}catch(e){status.textContent='تعذر فتح الكتاب: '+e.message}})();prev.onclick=()=>{if(page>1){page--;draw()}};next.onclick=()=>{if(pdf&&page<pdf.numPages){page++;draw()}};document.getElementById('bigger').onclick=()=>{scale=Math.min(2.2,scale+.15);draw()};document.getElementById('smaller').onclick=()=>{scale=Math.max(.65,scale-.15);draw()};document.getElementById('theme').onclick=()=>document.body.classList.toggle('light');
</script></body></html>
