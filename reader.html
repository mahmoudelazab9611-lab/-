<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>قراءة — حين دقت القلوب على أبواب مصر</title><link rel="stylesheet" href="style.css"></head>
<body class="reader-page"><header class="reader-head"><a href="index.html">← العودة للمكتبة</a><strong>حين دقت القلوب على أبواب مصر</strong><span>قراءة داخل الموقع</span></header>
<main class="reader-wrap"><div class="reader-note">استخدم أزرار التالي والسابق للتنقل بين صفحات الكتاب. لا يتوفر تنزيل من واجهة القراءة.</div>
<div class="reader-controls"><button id="prev">السابق</button><span>صفحة <b id="pageNum">1</b> من <b id="pageCount">215</b></span><button id="next">التالي</button><button id="zoomOut" aria-label="تصغير">−</button><button id="zoomIn" aria-label="تكبير">+</button></div>
<div id="loading">جارٍ تحميل الكتاب…</div><canvas id="pdfCanvas"></canvas>
<div class="reader-controls bottom"><button id="prev2">السابق</button><span>صفحة <b id="pageNum2">1</b></span><button id="next2">التالي</button></div>
</main><footer>حقوق التأليف والنشر محفوظة لمحمود يسري العزب. يمنع النسخ أو إعادة النشر أو التوزيع دون إذن كتابي.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const url='books/حين-دقت-القلوب-على-ابواب-مصر.pdf';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfDoc=null,page=1,scale=1.25,rendering=false,pending=null;
const canvas=document.getElementById('pdfCanvas'),ctx=canvas.getContext('2d');
function renderPage(n){rendering=true;document.getElementById('loading').style.display='block';
pdfDoc.getPage(n).then(p=>{const viewport=p.getViewport({scale:scale});canvas.width=viewport.width;canvas.height=viewport.height;
return p.render({canvasContext:ctx,viewport}).promise;}).then(()=>{rendering=false;document.getElementById('loading').style.display='none';
document.getElementById('pageNum').textContent=n;document.getElementById('pageNum2').textContent=n;
if(pending!==null){const x=pending;pending=null;renderPage(x);}}).catch(()=>{rendering=false;document.getElementById('loading').textContent='تعذر عرض الصفحة. تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة.';});}
function queue(n){if(!pdfDoc)return;page=Math.max(1,Math.min(n,pdfDoc.numPages));if(rendering)pending=page;else renderPage(page);}
pdfjsLib.getDocument({url}).promise.then(doc=>{pdfDoc=doc;document.getElementById('pageCount').textContent=doc.numPages;queue(1);})
.catch(()=>{document.getElementById('loading').textContent='تعذر فتح الكتاب. تأكد من رفع ملف PDF داخل مجلد books مع الحفاظ على اسمه.';});
['prev','prev2'].forEach(id=>document.getElementById(id).onclick=()=>queue(page-1));
['next','next2'].forEach(id=>document.getElementById(id).onclick=()=>queue(page+1));
document.getElementById('zoomIn').onclick=()=>{scale=Math.min(2.2,scale+0.15);queue(page)};
document.getElementById('zoomOut').onclick=()=>{scale=Math.max(.7,scale-.15);queue(page)};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')queue(page+1);if(e.key==='ArrowRight')queue(page-1)});
</script></body></html>
